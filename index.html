<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Papers Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        header p {
            color: #888;
            font-size: 1.1rem;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .filters {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-group label {
            font-size: 0.9rem;
            color: #aaa;
            font-weight: 500;
        }
        
        select, input[type="text"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            font-size: 0.95rem;
            min-width: 150px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        select:hover, input[type="text"]:hover {
            border-color: #667eea;
        }
        
        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        input[type="text"] {
            min-width: 250px;
        }
        
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .paper-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .paper-card:hover {
            transform: translateY(-4px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.15);
        }
        
        .paper-venue {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        
        .venue-iclr { background: linear-gradient(135deg, #667eea, #764ba2); }
        .venue-neurips { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .venue-icml { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .venue-acl { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .venue-emnlp { background: linear-gradient(135deg, #fa709a, #fee140); }
        .venue-colm { background: linear-gradient(135deg, #a8edea, #fed6e3); color: #333; }
        
        .paper-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .paper-authors {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .paper-abstract {
            font-size: 0.9rem;
            color: #888;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .paper-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        
        .tag {
            background: rgba(102, 126, 234, 0.2);
            color: #a0a0ff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        
        .tag.area {
            background: rgba(67, 233, 123, 0.2);
            color: #7dffaf;
        }
        
        .tag.award {
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: #fff;
        }
        
        .paper-links {
            display: flex;
            gap: 10px;
        }
        
        .paper-links a {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .paper-links a:hover {
            background: #667eea;
            color: #fff;
        }
        
        .tldr {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #b0b0ff;
        }
        
        .tldr strong {
            color: #667eea;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 40px;
            padding: 20px;
        }
        
        .pagination button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #667eea;
            border-color: #667eea;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination span {
            color: #888;
            font-size: 0.9rem;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .no-results i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #444;
        }
        
        .loading {
            text-align: center;
            padding: 100px;
            color: #667eea;
        }
        
        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .papers-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            select, input[type="text"] {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-book-open"></i> LLM Papers Dashboard</h1>
        <p>Oral & Spotlight papers from top ML/NLP conferences (2024-2026)</p>
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="total-papers">0</div>
                <div class="stat-label">Papers</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-conferences">0</div>
                <div class="stat-label">Conferences</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="filtered-count">0</div>
                <div class="stat-label">Showing</div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="filters">
            <div class="filter-group">
                <label><i class="fas fa-building"></i> Conference:</label>
                <select id="conference-filter">
                    <option value="all">All Conferences</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-calendar"></i> Year:</label>
                <select id="year-filter">
                    <option value="all">All Years</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-search"></i> Search:</label>
                <input type="text" id="search-input" placeholder="Search by title, author, or keyword...">
            </div>
        </div>
        
        <div id="papers-container" class="papers-grid">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Loading papers...</p>
            </div>
        </div>
        
        <div class="pagination" id="pagination" style="display: none;">
            <button id="prev-btn"><i class="fas fa-chevron-left"></i> Previous</button>
            <span id="page-info"></span>
            <button id="next-btn">Next <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
    
    <script>
        let allPapers = [];
        let filteredPapers = [];
        let currentPage = 1;
        const papersPerPage = 20;
        
        const venueFiles = {
            'ICLR 2024': 'papers/iclr2024_oral_spotlight.jsonl',
            'ICLR 2025': 'papers/iclr2025_oral_spotlight.jsonl',
            'ICLR 2026': 'papers/iclr2026_oral_spotlight.jsonl',
            'NeurIPS 2024': 'papers/neurips2024_oral_spotlight.jsonl',
            'NeurIPS 2025': 'papers/neurips2025_oral_spotlight.jsonl',
            'ICML 2024': 'papers/icml2024_oral_spotlight.jsonl',
            'ICML 2025': 'papers/icml2025_oral_spotlight.jsonl',
            'ACL 2024': 'papers/acl2024_oral.jsonl',
            'ACL 2025': 'papers/acl2025_oral.jsonl',
            'EMNLP 2024': 'papers/emnlp2024_oral.jsonl',
            'EMNLP 2025': 'papers/emnlp2025_oral.jsonl',
            'COLM 2024': 'papers/colm2024_all.jsonl',
            'COLM 2025': 'papers/colm2025_all.jsonl',
        };
        
        async function loadPapers() {
            const promises = Object.entries(venueFiles).map(async ([venue, file]) => {
                try {
                    const response = await fetch(file);
                    if (!response.ok) return [];
                    const text = await response.text();
                    const lines = text.trim().split('\n');
                    return lines.map(line => {
                        const paper = JSON.parse(line);
                        paper.venue = venue;
                        return paper;
                    });
                } catch (e) {
                    console.error(`Error loading ${file}:`, e);
                    return [];
                }
            });
            
            const results = await Promise.all(promises);
            allPapers = results.flat();
            
            // Sort by venue then title
            allPapers.sort((a, b) => {
                const venueCompare = a.venue.localeCompare(b.venue);
                if (venueCompare !== 0) return venueCompare;
                return a.title.localeCompare(b.title);
            });
            
            updateStats();
            populateFilters();
            applyFilters();
        }
        
        function updateStats() {
            document.getElementById('total-papers').textContent = allPapers.length;
            const conferences = new Set(allPapers.map(p => p.venue.split(' ')[0]));
            document.getElementById('total-conferences').textContent = conferences.size;
        }
        
        function populateFilters() {
            const conferences = [...new Set(allPapers.map(p => p.venue.split(' ')[0]))].sort();
            const years = [...new Set(allPapers.map(p => p.venue.split(' ')[1]))].sort();
            
            const conferenceSelect = document.getElementById('conference-filter');
            conferences.forEach(conf => {
                const option = document.createElement('option');
                option.value = conf;
                option.textContent = conf;
                conferenceSelect.appendChild(option);
            });
            
            const yearSelect = document.getElementById('year-filter');
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
        }
        
        function applyFilters() {
            const conference = document.getElementById('conference-filter').value;
            const year = document.getElementById('year-filter').value;
            const search = document.getElementById('search-input').value.toLowerCase();
            
            filteredPapers = allPapers.filter(paper => {
                const [conf, yr] = paper.venue.split(' ');
                if (conference !== 'all' && conf !== conference) return false;
                if (year !== 'all' && yr !== year) return false;
                if (search) {
                    const searchFields = [
                        paper.title,
                        paper.authors.join(' '),
                        paper.abstract,
                        paper.keywords?.join(' ') || '',
                        paper.tldr || '',
                        paper.primary_area || ''
                    ].join(' ').toLowerCase();
                    if (!searchFields.includes(search)) return false;
                }
                return true;
            });
            
            currentPage = 1;
            renderPapers();
        }
        
        function renderPapers() {
            const container = document.getElementById('papers-container');
            const start = (currentPage - 1) * papersPerPage;
            const end = start + papersPerPage;
            const papersToShow = filteredPapers.slice(start, end);
            
            document.getElementById('filtered-count').textContent = filteredPapers.length;
            
            if (papersToShow.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <p>No papers found matching your criteria</p>
                    </div>
                `;
                document.getElementById('pagination').style.display = 'none';
                return;
            }
            
            container.innerHTML = papersToShow.map(paper => createPaperCard(paper)).join('');
            
            // Update pagination
            const totalPages = Math.ceil(filteredPapers.length / papersPerPage);
            document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
        }
        
        function createPaperCard(paper) {
            const [conf, year] = paper.venue.split(' ');
            const venueClass = `venue-${conf.toLowerCase()}`;
            
            const keywords = (paper.keywords || []).slice(0, 5);
            const area = paper.primary_area;
            const award = paper.award;
            
            let tagsHtml = '';
            if (award) {
                tagsHtml += `<span class="tag award"><i class="fas fa-award"></i> ${award}</span>`;
            }
            if (area) {
                tagsHtml += `<span class="tag area">${area}</span>`;
            }
            keywords.forEach(kw => {
                tagsHtml += `<span class="tag">${kw}</span>`;
            });
            
            const tldrHtml = paper.tldr ? `
                <div class="tldr">
                    <strong>TL;DR:</strong> ${paper.tldr}
                </div>
            ` : '';
            
            const authors = paper.authors || [];
            const authorsStr = authors.length > 5 
                ? authors.slice(0, 5).join(', ') + ` et al. (${authors.length} authors)`
                : authors.join(', ');
            
            return `
                <div class="paper-card">
                    <span class="paper-venue ${venueClass}">${paper.venue}</span>
                    <h3 class="paper-title">${escapeHtml(paper.title)}</h3>
                    <p class="paper-authors"><i class="fas fa-users"></i> ${escapeHtml(authorsStr)}</p>
                    ${tldrHtml}
                    <p class="paper-abstract">${escapeHtml(paper.abstract || 'No abstract available')}</p>
                    <div class="paper-tags">${tagsHtml}</div>
                    <div class="paper-links">
                        <a href="${paper.pdf_url}" target="_blank"><i class="fas fa-file-pdf"></i> PDF</a>
                        <a href="${paper.html_url}" target="_blank"><i class="fas fa-external-link-alt"></i> View</a>
                    </div>
                </div>
            `;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Event listeners
        document.getElementById('conference-filter').addEventListener('change', applyFilters);
        document.getElementById('year-filter').addEventListener('change', applyFilters);
        document.getElementById('search-input').addEventListener('input', debounce(applyFilters, 300));
        
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPapers();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        
        document.getElementById('next-btn').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredPapers.length / papersPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPapers();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // Load papers on page load
        loadPapers();
    </script>
</body>
</html>
