<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Papers Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/favorites.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-book-open"></i> LLM Papers Dashboard</h1>
        <p>Oral & Spotlight papers from top ML/NLP conferences (2024-2026)</p>
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="total-papers">0</div>
                <div class="stat-label">Papers</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-conferences">0</div>
                <div class="stat-label">Conferences</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="filtered-count">0</div>
                <div class="stat-label">Showing</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="fav-stat-count">0</div>
                <div class="stat-label">Favorites</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <div class="filter-group">
                <label><i class="fas fa-building"></i> Conference:</label>
                <div class="custom-select" data-id="conference-filter" data-value="all">
                    <div class="custom-select-trigger"><span>All Conferences</span><i class="fas fa-chevron-down"></i></div>
                    <div class="custom-select-options"></div>
                </div>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-calendar"></i> Year:</label>
                <div class="custom-select" data-id="year-filter" data-value="all">
                    <div class="custom-select-trigger"><span>All Years</span><i class="fas fa-chevron-down"></i></div>
                    <div class="custom-select-options"></div>
                </div>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-search"></i> Search:</label>
                <input type="text" id="search-input" placeholder="Search by title, author, or keyword...">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-th-list"></i> Per page:</label>
                <div class="custom-select" data-id="per-page-select" data-value="20">
                    <div class="custom-select-trigger"><span>20</span><i class="fas fa-chevron-down"></i></div>
                    <div class="custom-select-options"></div>
                </div>
            </div>
            <button id="fav-filter-btn" class="fav-filter-btn">
                <i class="fas fa-heart"></i> Favorites <span id="fav-count">0</span>
            </button>
            <button id="export-btn" class="export-btn">
                <i class="fas fa-download"></i> Export
            </button>
        </div>

        <div id="papers-container" class="papers-grid">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Loading papers...</p>
            </div>
        </div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="prev-btn"><i class="fas fa-chevron-left"></i> Previous</button>
            <span class="page-info-wrapper">Page <input type="number" id="page-jump-input" min="1" value="1"> of <span id="total-pages">1</span></span>
            <button id="next-btn">Next <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="js/favorites.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/custom_select.js"></script>
    <script src="js/papers.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
